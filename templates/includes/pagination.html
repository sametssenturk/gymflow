{% if is_paginated %}
  <nav class="pagination-shell" aria-label="Sayfalama">
    <div class="text-soft small">
      Sayfa {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
    </div>
    <div class="pagination-actions">
      {% if page_obj.has_previous %}
        <a class="btn btn-ghost btn-sm" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}">
          <i class="bi bi-chevron-left"></i>
          Önceki
        </a>
      {% endif %}
      {% if page_obj.has_next %}
        <a class="btn btn-ghost btn-sm" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q|urlencode }}{% endif %}">
          Sonraki
          <i class="bi bi-chevron-right"></i>
        </a>
      {% endif %}
    </div>
  </nav>
{% endif %}
