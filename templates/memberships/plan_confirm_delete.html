{% extends "app_base.html" %}
{% block title %}GymFlow | Paket Sil{% endblock %}
{% block page_title %}Paket Sil{% endblock %}

{% block content %}
<div class="form-shell text-center">
  <div class="mb-4">
    <div class="danger-icon mb-3"><i class="bi bi-exclamation-triangle"></i></div>
    <h2 class="section-title mb-2">Bu paketi silmek istediğinize emin misiniz?</h2>
    <p class="text-soft mb-0">
      <strong>{{ object.name }}</strong> kalıcı olarak silinecek.
    </p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="d-flex justify-content-center gap-2">
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash"></i>
        Evet, Sil
      </button>
      <a href="{% url 'memberships:plan_list' %}" class="btn btn-ghost">Vazgeç</a>
    </div>
  </form>
</div>
{% endblock %}
